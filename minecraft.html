<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .content-wrapper {
            display: flex;
            align-items: center;
            gap: 30px;
            max-width: 1200px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .image-wrapper {
            flex: 1;
            min-width: 300px;
            max-width: 600px;
            border: 3px solid #4caf50;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        img {
            width: 100%;
            height: auto;
            display: block;
        }

        .version-info {
            flex: 1;
            min-width: 200px;
            text-align: left;
        }

        .version-text {
            color: #4caf50;
            font-size: 2.5em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
        }

        .description {
            color: #cccccc;
            margin-top: 20px;
            font-size: 1.1em;
        }

        @media (max-width: 900px) {
            .content-wrapper {
                flex-direction: column;
                gap: 20px;
            }

            .version-info {
                text-align: center;
            }
        }

        .ip-container {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-top: 25px;
        }

        .ip-text {
            color: #4caf50;
            font-size: 1.5em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            background-color: rgba(76, 175, 80, 0.1);
            padding: 10px 15px;
            border: 2px solid #4caf50;
            border-radius: 5px;
        }

        .copy-btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
        }

        .copy-btn:hover {
            background-color: #45a049;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.6);
        }

        .copy-btn:active {
            transform: scale(0.98);
        }

        .copy-feedback {
            color: #4caf50;
            font-size: 0.9em;
            min-height: 20px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Minecraft - Serwer</h1>
        <div class="content-wrapper">
            <div class="image-wrapper">
                <img src="public/minecraft-server.png" alt="Minecraft Server">
            </div>
            <div class="version-info">
                <div class="version-text">wersja</div>
                <div class="version-text">1.21.11</div>
            </div>
        </div>
        <p class="description">Witaj na serwerze Minecraft!</p>
        <div class="ip-container">
            <span class="ip-text" id="ipText">204.168.163.56</span>
            <button class="copy-btn" onclick="copyIP()">Copy</button>
            <span class="copy-feedback" id="copyFeedback"></span>
        </div>
    </div>

    <script>
        function copyIP() {
            const ipText = document.getElementById('ipText').textContent;
            navigator.clipboard.writeText(ipText).then(() => {
                const feedback = document.getElementById('copyFeedback');
                feedback.textContent = '✓ Skopiowano!';
                setTimeout(() => {
                    feedback.textContent = '';
                }, 2000);
            }).catch(() => {
                alert('Błąd przy kopiowaniu');
            });
        }
    </script>
</body>
</html>
