<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .content-wrapper {
            display: flex;
            align-items: center;
            gap: 30px;
            max-width: 1200px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .image-wrapper {
            flex: 1;
            min-width: 300px;
            max-width: 600px;
            border: 3px solid #4caf50;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        img {
            width: 100%;
            height: auto;
            display: block;
        }

        .version-info {
            flex: 1;
            min-width: 200px;
            text-align: left;
        }

        .version-text {
            color: #4caf50;
            font-size: 2.5em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
        }

        .description {
            color: #cccccc;
            margin-top: 20px;
            font-size: 1.1em;
        }

        @media (max-width: 900px) {
            .content-wrapper {
                flex-direction: column;
                gap: 20px;
            }

            .version-info {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Minecraft - Serwer</h1>
        <div class="content-wrapper">
            <div class="image-wrapper">
                <img src="public/minecraft-server.png" alt="Minecraft Server">
            </div>
            <div class="version-info">
                <div class="version-text">wersja</div>
                <div class="version-text">1.21.11</div>
            </div>
        </div>
        <p class="description">Witaj na serwerze Minecraft!</p>
    </div>
</body>
</html>
