<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .image-wrapper {
            max-width: 900px;
            border: 3px solid #4caf50;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        img {
            width: 100%;
            height: auto;
            display: block;
        }

        .description {
            color: #cccccc;
            margin-top: 20px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Minecraft - Serwer</h1>
        <div class="image-wrapper">
            <img src="public/minecraft-server.png" alt="Minecraft Server">
        </div>
        <p class="description">Witaj na serwerze Minecraft!</p>
    </div>
</body>
</html>
