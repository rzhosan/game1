<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session 6573574 - Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .video-wrapper {
            position: relative;
            padding: 20px;
            background: #f5f5f5;
        }

        video {
            width: 100%;
            height: auto;
            border-radius: 10px;
            background: #000;
            display: block;
        }

        .footer {
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 0.9em;
            border-top: 1px solid #eee;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5em;
            }

            .header {
                padding: 20px;
            }

            .video-wrapper {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Session 6573574</h1>
            <p>Video Player</p>
        </div>

        <div class="video-wrapper">
            <video controls allowfullscreen>
                <source src="Untitled_Project_V3.mp4" type="video/mp4">
                Twoja przeglądarka nie wspiera odtwarzacza HTML5 video.
            </video>
        </div>

        <div class="footer">
            <p>&copy; 2026 - Untitled Project V2</p>
        </div>
    </div>
</body>
</html>
