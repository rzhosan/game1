<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Banner</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="bannerCanvas"></canvas>
    <script>
        const canvas = document.getElementById('bannerCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight * 0.4;
        
        // Draw beautiful fantasy arcade background
        function drawBanner() {
            // Sky gradient
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.6);
            skyGradient.addColorStop(0, '#87CEEB');
            skyGradient.addColorStop(1, '#E0F6FF');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height * 0.6);
            
            // Ground gradient
            const groundGradient = ctx.createLinearGradient(0, canvas.height * 0.6, 0, canvas.height);
            groundGradient.addColorStop(0, '#90EE90');
            groundGradient.addColorStop(1, '#228B22');
            ctx.fillStyle = groundGradient;
            ctx.fillRect(0, canvas.height * 0.6, canvas.width, canvas.height * 0.4);
            
            // Draw clouds
            drawClouds();
            
            // Draw castle in background
            drawCastle();
            
            // Draw rainbow
            drawRainbow();
            
            // Draw coins
            drawCoins();
            
            // Draw treasure chest
            drawTreasureChest();
            
            // Draw main title
            drawTitle();
            
            // Draw decorative elements
            drawMushroom();
            drawPotion();
        }
        
        function drawClouds() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            
            // Cloud 1
            drawCloud(canvas.width * 0.1, canvas.height * 0.15, 80);
            // Cloud 2
            drawCloud(canvas.width * 0.8, canvas.height * 0.1, 100);
            // Cloud 3
            drawCloud(canvas.width * 0.5, canvas.height * 0.25, 70);
        }
        
        function drawCloud(x, y, size) {
            ctx.beginPath();
            ctx.arc(x, y, size * 0.4, 0, Math.PI * 2);
            ctx.arc(x + size * 0.35, y, size * 0.45, 0, Math.PI * 2);
            ctx.arc(x + size * 0.7, y, size * 0.4, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawCastle() {
            const castleX = canvas.width * 0.75;
            const castleY = canvas.height * 0.25;
            
            // Main towers
            for (let i = 0; i < 4; i++) {
                ctx.fillStyle = '#CD853F';
                ctx.fillRect(castleX + i * 40, castleY - 80, 30, 100);
                
                // Castle tops
                ctx.fillStyle = '#DC143C';
                ctx.beginPath();
                ctx.moveTo(castleX + i * 40, castleY - 80);
                ctx.lineTo(castleX + i * 40 + 15, castleY - 100);
                ctx.lineTo(castleX + i * 40 + 30, castleY - 80);
                ctx.fill();
            }
            
            // Center tower
            ctx.fillStyle = '#CD853F';
            ctx.fillRect(castleX + 70, castleY - 120, 40, 140);
            ctx.fillStyle = '#DC143C';
            ctx.beginPath();
            ctx.moveTo(castleX + 70, castleY - 120);
            ctx.lineTo(castleX + 90, castleY - 150);
            ctx.lineTo(castleX + 110, castleY - 120);
            ctx.fill();
            
            // Center tower flag
            ctx.fillStyle = '#FF6347';
            ctx.fillRect(castleX + 100, castleY - 140, 40, 3);
            ctx.beginPath();
            ctx.moveTo(castleX + 100, castleY - 140);
            ctx.lineTo(castleX + 100, castleY - 125);
            ctx.lineTo(castleX + 130, castleY - 132);
            ctx.fill();
        }
        
        function drawRainbow() {
            const startX = canvas.width * 0.2;
            const startY = canvas.height * 0.5;
            const radius = 100;
            
            const colors = ['#FF0000', '#FF7F00', '#FFFF00', '#00FF00', '#0000FF', '#4B0082', '#9400D3'];
            
            for (let i = 0; i < colors.length; i++) {
                ctx.strokeStyle = colors[i];
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.arc(startX, startY, radius - i * 10, Math.PI, 0);
                ctx.stroke();
            }
        }
        
        function drawCoins() {
            const coinPositions = [
                { x: canvas.width * 0.15, y: canvas.height * 0.35 },
                { x: canvas.width * 0.25, y: canvas.height * 0.4 },
                { x: canvas.width * 0.32, y: canvas.height * 0.55 },
                { x: canvas.width * 0.45, y: canvas.height * 0.65 },
                { x: canvas.width * 0.55, y: canvas.height * 0.75 }
            ];
            
            coinPositions.forEach(pos => {
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 15, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = '#FFA500';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Coin details
                ctx.strokeStyle = '#FFD700';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 10, 0, Math.PI * 2);
                ctx.stroke();
            });
        }
        
        function drawTreasureChest() {
            const chestX = canvas.width * 0.05;
            const chestY = canvas.height * 0.65;
            
            // Chest body
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(chestX, chestY, 80, 50);
            
            // Chest lid
            ctx.fillStyle = '#A0522D';
            ctx.beginPath();
            ctx.arc(chestX + 40, chestY, 40, Math.PI, 0);
            ctx.fill();
            
            // Gold inside
            ctx.fillStyle = '#FFD700';
            for (let i = 0; i < 5; i++) {
                ctx.fillRect(chestX + 10 + i * 14, chestY + 20, 10, 15);
            }
            
            // Lock
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(chestX + 35, chestY + 25, 10, 15);
            ctx.beginPath();
            ctx.arc(chestX + 40, chestY + 28, 3, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawMushroom() {
            const mushroomX = canvas.width * 0.9;
            const mushroomY = canvas.height * 0.65;
            
            // Stem
            ctx.fillStyle = '#D2B48C';
            ctx.fillRect(mushroomX - 10, mushroomY, 20, 40);
            
            // Cap
            ctx.fillStyle = '#FF0000';
            ctx.beginPath();
            ctx.arc(mushroomX, mushroomY, 35, Math.PI, 0);
            ctx.fill();
            
            // Spots
            ctx.fillStyle = '#FFFFFF';
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.arc(mushroomX - 20 + i * 15, mushroomY - 15, 5, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function drawPotion() {
            const potionX = canvas.width * 0.12;
            const potionY = canvas.height * 0.75;
            
            // Bottle
            ctx.fillStyle = '#008000';
            ctx.fillRect(potionX, potionY, 20, 40);
            
            // Bottle top
            ctx.fillStyle = '#FF8C00';
            ctx.fillRect(potionX + 7, potionY - 5, 6, 8);
            
            // Liquid inside
            ctx.fillStyle = 'rgba(0, 255, 0, 0.7)';
            ctx.fillRect(potionX + 2, potionY + 20, 16, 18);
            
            // Shine
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 2;
            ctx.strokeRect(potionX + 2, potionY + 2, 5, 15);
        }
        
        function drawTitle() {
            // Draw glowing text
            ctx.font = 'bold 72px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Shadow and glow effect
            ctx.shadowColor = 'rgba(255, 0, 255, 0.8)';
            ctx.shadowBlur = 20;
            ctx.shadowOffsetX = 5;
            ctx.shadowOffsetY = 5;
            
            // Text colors
            ctx.fillStyle = '#FFFF00';
            ctx.fillText("MARK'S ARCADES", canvas.width / 2, canvas.height / 2 - 30);
            
            // Subtitle
            ctx.font = 'bold 32px Arial';
            ctx.fillStyle = '#00FFFF';
            ctx.fillText("🎮 PLAY THE GAMES 🎮", canvas.width / 2, canvas.height / 2 + 30);
            
            ctx.shadowColor = 'transparent';
        }
        
        // Initial draw
        drawBanner();
        
        // Redraw on window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.4;
            drawBanner();
        });
        
        // Simple animation loop
        let animationFrame = 0;
        function animate() {
            animationFrame++;
            drawBanner();
            
            // Add floating effect to coins
            if (animationFrame % 60 === 0) {
                // Redraw to update animations
            }
            
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
