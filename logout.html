<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', 'Courier', monospace;
            background: linear-gradient(135deg, rgba(45, 27, 78, 0.7) 0%, rgba(61, 45, 95, 0.7) 25%, rgba(26, 58, 58, 0.7) 50%, rgba(45, 63, 63, 0.7) 75%, rgba(61, 45, 95, 0.7) 100%), url('background.png');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00ff00;
        }

        .logout-container {
            background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 100%);
            border: 3px solid #00ff00;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
            max-width: 500px;
        }

        h1 {
            color: #ffff00;
            margin-bottom: 20px;
            font-size: 2em;
            text-shadow: 2px 2px #ff00ff;
        }

        p {
            color: #00ffff;
            margin-bottom: 30px;
            font-size: 1.1em;
            text-shadow: 1px 1px #ff00ff;
        }

        .redirecting {
            color: #ff00ff;
            font-size: 0.9em;
            margin-top: 20px;
        }

        a.home-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            border: 2px solid #00ff00;
            color: #00ff00;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
            text-shadow: 1px 1px #ff00ff;
            font-weight: bold;
        }

        a.home-link:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.7);
        }

        .error-container {
            display: none;
            text-align: center;
        }

        .error-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .error-container h1 {
            color: #ff4444;
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .error-container p {
            color: #cccccc;
            margin-bottom: 15px;
        }

        .error-code {
            color: #ff6666;
            font-family: monospace;
            font-size: 0.9em;
            margin-top: 20px;
        }

        .error-suggestions {
            text-align: left;
            display: inline-block;
            margin-top: 20px;
            color: #00ffff;
            font-size: 0.9em;
        }

        .error-suggestions li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <div id="logout-success">
            <h1>LOGGED OUT</h1>
            <p>You have been successfully logged out.</p>
            <div class="redirecting">Redirecting to home page in <span id="countdown">3</span> seconds...</div>
            <a href="/" class="home-link">Return Home</a>
        </div>
        <div id="logout-error" class="error-container">
            <div class="error-icon">📄</div>
            <h1>Ta witryna jest niedostępna</h1>
            <p id="error-message">Server mark's arcade odmówił połączenia.</p>
            <div class="error-suggestions">
                <p>Wypróbuj te rozwiązania:</p>
                <ul>
                    <li>Sprawdź połączenie</li>
                    <li>Sprawdź serwer proxy i zaporę sieciową</li>
                </ul>
            </div>
            <div class="error-code" id="error-code">ERR_CONNECTION_REFUSED</div>
            <button onclick="location.reload()" class="home-link" style="margin-top: 30px;">Odśwież</button>
        </div>
    </div>

    <script>
        // Check connection and handle login/logout errors
        function checkConnection() {
            return fetch('/', { method: 'HEAD', cache: 'no-cache' })
                .then(response => response.ok)
                .catch(() => false);
        }

        async function handleLogout() {
            const isConnected = await checkConnection();
            
            if (!isConnected) {
                // Show error state
                document.getElementById('logout-success').style.display = 'none';
                document.getElementById('logout-error').style.display = 'block';
                return;
            }

            // Proceed with normal logout
            // Clear all user data from localStorage
            const keys = Object.keys(localStorage);
            keys.forEach(key => {
                localStorage.removeItem(key);
            });

            // Clear sessionStorage as well
            sessionStorage.clear();

            // Clear all cookies
            function clearAllCookies() {
                document.cookie.split(";").forEach(function(c) {
                    document.cookie = c
                        .replace(/^ +/, "")
                        .replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
                });
            }
            clearAllCookies();

            // Countdown and redirect
            let countdown = 3;
            const countdownElement = document.getElementById('countdown');

            const countdownInterval = setInterval(() => {
                countdown--;
                countdownElement.textContent = countdown;
                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    window.location.href = '/';
                }
            }, 1000);
        }

        // Execute logout handler when page loads
        window.addEventListener('load', handleLogout);
    </script>
</body>
</html>
