<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zgadywanka - Gra z Zadaniami</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 500px;
      width: 100%;
      margin: 20px;
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
    }

    h2 {
      color: #667eea;
      font-size: 24px;
      margin-bottom: 15px;
    }

    #menu {
      display: grid;
      gap: 15px;
    }

    .menu-button {
      padding: 20px;
      font-size: 18px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: bold;
    }

    .menu-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .difficulty {
      font-size: 14px;
      opacity: 0.9;
      margin-top: 5px;
    }

    .game-area {
      display: none;
    }

    .game-area.active {
      display: block;
    }

    input {
      padding: 10px 15px;
      font-size: 16px;
      border: 2px solid #667eea;
      border-radius: 5px;
      margin-right: 10px;
      width: 120px;
    }

    button {
      padding: 10px 25px;
      font-size: 16px;
      background-color: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover:not(:disabled) {
      background-color: #764ba2;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #wynik {
      margin-top: 20px;
      font-size: 18px;
      min-height: 30px;
      color: #333;
      font-weight: bold;
    }

    .success {
      color: #27ae60;
    }

    .hint {
      color: #e74c3c;
    }

    .stats {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 5px;
      font-size: 14px;
    }

    .back-button {
      margin-top: 20px;
      background-color: #95a5a6;
    }

    .back-button:hover {
      background-color: #7f8c8d;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Zgadywanka</h1>

    <!-- MENU -->
    <div id="menu">
      <h2>Wybierz zadanie:</h2>
      <button class="menu-button" onclick="startGame(10, 'ŁATWE')">
        ⭐ ŁATWE
        <div class="difficulty">Zgadnij liczbę od 1 do 10</div>
      </button>
      <button class="menu-button" onclick="startGame(100, 'ŚREDNIE')">
        ⭐⭐ ŚREDNIE
        <div class="difficulty">Zgadnij liczbę od 1 do 100</div>
      </button>
      <button class="menu-button" onclick="startGame(1000, 'TRUDNE')">
        ⭐⭐⭐ TRUDNE
        <div class="difficulty">Zgadnij liczbę od 1 do 1000</div>
      </button>
      <button class="menu-button" onclick="startGame(100, 'PROFESJONALNE')">
        ⭐⭐⭐⭐ PROFESJONALNE
        <div class="difficulty">Zgadnij 5 liczb od 1 do 100</div>
      </button>
    </div>

    <!-- GRA -->
    <div id="gameArea" class="game-area">
      <h2 id="gameTitle"></h2>
      <div id="gameContent">
        <div>
          <input type="number" id="input" placeholder="Wpisz liczbę">
          <button id="checkBtn" onclick="sprawdz()">Sprawdź</button>
        </div>
        <p id="wynik"></p>
        <div class="stats">
          <div>Próba: <strong id="probyCount">0</strong></div>
          <div id="roundInfo"></div>
        </div>
      </div>
      <button class="back-button" onclick="backToMenu()">← Powrót do menu</button>
    </div>
  </div>

  <script>
    let liczba = 0;
    let proby = 0;
    let maxZakres = 100;
    let tryb = 'ŚREDNIE';
    let rundy = 1;
    let maxRundy = 1;
    let wygraneRundy = 0;

    function startGame(zakres, mode) {
      maxZakres = zakres;
      tryb = mode;
      rundy = 1;
      wygraneRundy = 0;

      if (mode === 'PROFESJONALNE') {
        maxRundy = 5;
      } else {
        maxRundy = 1;
      }

      startNewRound();
      document.getElementById('menu').style.display = 'none';
      document.getElementById('gameArea').classList.add('active');
    }

    function startNewRound() {
      liczba = Math.floor(Math.random() * maxZakres) + 1;
      proby = 0;
      document.getElementById('input').disabled = false;
      document.getElementById('checkBtn').disabled = false;
      document.getElementById('input').value = '';
      document.getElementById('wynik').innerHTML = '';
      document.getElementById('wynik').className = '';

      updateGameTitle();
      updateStats();
      document.getElementById('input').focus();
    }

    function updateGameTitle() {
      let title = `${tryb} - Zgadnij liczbę od 1 do ${maxZakres}`;
      if (maxRundy > 1) {
        title += ` (Runda ${rundy}/${maxRundy})`;
      }
      document.getElementById('gameTitle').innerHTML = title;
    }

    function updateStats() {
      document.getElementById('probyCount').innerHTML = proby;
      if (maxRundy > 1) {
        document.getElementById('roundInfo').innerHTML = `Wygrane rundy: ${wygraneRundy}/${maxRundy}`;
      } else {
        document.getElementById('roundInfo').innerHTML = '';
      }
    }

    function sprawdz() {
      let proba = parseInt(document.getElementById('input').value);

      if (isNaN(proba) || proba < 1 || proba > maxZakres) {
        alert(`Proszę wpisać liczbę od 1 do ${maxZakres}`);
        return;
      }

      proby++;
      let wynik = document.getElementById('wynik');

      if (proba < liczba) {
        wynik.innerHTML = `⬇️ Za nisko! Próba ${proby}`;
        wynik.className = 'hint';
      } else if (proba > liczba) {
        wynik.innerHTML = `⬆️ Za wysoko! Próba ${proby}`;
        wynik.className = 'hint';
      } else {
        wynik.innerHTML = `✅ Brawo! Zgadłeś po ${proby} próbach!`;
        wynik.className = 'success';
        document.getElementById('input').disabled = true;
        document.getElementById('checkBtn').disabled = true;
        wygraneRundy++;

        if (rundy < maxRundy) {
          wynik.innerHTML += `<br><br>Następna runda za 2 sekundy...`;
          setTimeout(() => {
            rundy++;
            startNewRound();
          }, 2000);
        } else {
          wynik.innerHTML += `<br><br>🎉 Gratulacje! Ukończyłeś wszystkie rundy!`;
        }
        updateStats();
        return;
      }

      updateStats();
      document.getElementById('input').focus();
    }

    function backToMenu() {
      document.getElementById('gameArea').classList.remove('active');
      document.getElementById('menu').style.display = 'block';
      rundy = 1;
      wygraneRundy = 0;
    }

    // Enable Enter key to submit
    document.getElementById('input').addEventListener('keypress', function(event) {
      if (event.key === 'Enter' && !document.getElementById('checkBtn').disabled) {
        sprawdz();
      }
    });
  </script>
</body>
</html>
