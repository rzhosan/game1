<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zgadywanka - Gra z Zadaniami</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 500px;
      width: 100%;
      margin: 20px;
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
    }

    h2 {
      color: #667eea;
      font-size: 24px;
      margin-bottom: 15px;
    }

    #menu {
      display: grid;
      gap: 15px;
    }

    .menu-button {
      padding: 20px;
      font-size: 18px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: bold;
    }

    .menu-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .difficulty {
      font-size: 14px;
      opacity: 0.9;
      margin-top: 5px;
    }

    .game-area {
      display: none;
    }

    .game-area.active {
      display: block;
    }

    input {
      padding: 10px 15px;
      font-size: 16px;
      border: 2px solid #667eea;
      border-radius: 5px;
      margin-right: 10px;
      width: 120px;
    }

    button {
      padding: 10px 25px;
      font-size: 16px;
      background-color: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover:not(:disabled) {
      background-color: #764ba2;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #wynik {
      margin-top: 20px;
      font-size: 18px;
      min-height: 30px;
      color: #333;
      font-weight: bold;
    }

    .success {
      color: #27ae60;
    }

    .hint {
      color: #e74c3c;
    }

    .stats {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 5px;
      font-size: 14px;
    }

    .back-button {
      margin-top: 20px;
      background-color: #95a5a6;
    }

    .back-button:hover {
      background-color: #7f8c8d;
    }

    #loginSection {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    #loginSection h2 {
      margin-bottom: 10px;
    }

    .google-button-wrapper {
      transform: scale(1.2);
      transform-origin: center;
    }

    #userInfo {
      display: none;
      text-align: center;
      margin-bottom: 20px;
    }

    #userInfo.active {
      display: block;
    }

    #userInfo img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    #userName {
      font-weight: bold;
      color: #667eea;
      margin-bottom: 10px;
    }

    .logout-btn {
      padding: 8px 20px;
      font-size: 14px;
      background-color: #e74c3c;
      margin-top: 10px;
    }

    .logout-btn:hover {
      background-color: #c0392b;
    }

    .warning-box {
      background: #fff3cd;
      border: 2px solid #ffc107;
      border-radius: 8px;
      padding: 15px;
      margin: 20px 0;
      color: #856404;
      font-size: 14px;
      line-height: 1.6;
    }

    .warning-box strong {
      display: block;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .menu-active {
      display: none;
    }

    .menu-active.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Zgadywanka</h1>

    <!-- LOGIN SECTION -->
    <div id="loginSection">
      <h2>Zaloguj się przez Google</h2>
      <p>Aby grać, musisz się zalogować</p>
      <div id="g_id_onload"
           data-client_id="YOUR_GOOGLE_CLIENT_ID"
           data-callback="handleCredentialResponse">
      </div>
      <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"></div>
    </div>

    <!-- USER INFO -->
    <div id="userInfo">
      <img id="userPhoto" src="" alt="Zdjęcie profilowe">
      <div id="userName"></div>
      <button class="logout-btn" onclick="logout()">Wyloguj się</button>
    </div>

    <!-- WARNING MESSAGE -->
    <div id="warningBox" class="warning-box" style="display: none;">
      <strong>⚠️ Ważne:</strong>
      Nie sprawdzaj liczby w konsoli programisty (F12)! To zepsuje grę i przyjmę to jako oszukiwanie. Graj uczciwnie i ciesz się zabawą!
    </div>

    <!-- MENU -->
    <div id="menu" class="menu-active">
      <h2>Wybierz zadanie:</h2>
      <button class="menu-button" onclick="startGame(10, 'ŁATWE')">
        ⭐ ŁATWE
        <div class="difficulty">Zgadnij liczbę od 1 do 10</div>
      </button>
      <button class="menu-button" onclick="startGame(100, 'ŚREDNIE')">
        ⭐⭐ ŚREDNIE
        <div class="difficulty">Zgadnij liczbę od 1 do 100</div>
      </button>
      <button class="menu-button" onclick="startGame(1000, 'TRUDNE')">
        ⭐⭐⭐ TRUDNE
        <div class="difficulty">Zgadnij liczbę od 1 do 1000</div>
      </button>
      <button class="menu-button" onclick="startGame(100, 'PROFESJONALNE')">
        ⭐⭐⭐⭐ PROFESJONALNE
        <div class="difficulty">Zgadnij 5 liczb od 1 do 100</div>
      </button>
    </div>

    <!-- GRA -->
    <div id="gameArea" class="game-area">
      <h2 id="gameTitle"></h2>
      <div id="gameContent">
        <div>
          <input type="number" id="input" placeholder="Wpisz liczbę">
          <button id="checkBtn" onclick="sprawdz()">Sprawdź</button>
        </div>
        <p id="wynik"></p>
        <div class="stats">
          <div>Próba: <strong id="probyCount">0</strong></div>
          <div id="roundInfo"></div>
        </div>
      </div>
      <button class="back-button" onclick="backToMenu()">← Powrót do menu</button>
    </div>
  </div>

  <script>
    let isLoggedIn = false;
    let trenutniKorisnik = null;
    let liczba = 0;
    let proby = 0;
    let maxZakres = 100;
    let tryb = 'ŚREDNIE';
    let rundy = 1;
    let maxRundy = 1;
    let wygraneRundy = 0;

    // Google Sign-In Callback
    function handleCredentialResponse(response) {
      // JWT token from Google
      const token = response.credential;
      
      // Decode JWT to get user info (without verification for simplicity)
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));

      const userData = JSON.parse(jsonPayload);
      
      // Zapisz dane do localStorage (taki sam klucz jak w index.html)
      localStorage.setItem('marcadesCurrentUser', JSON.stringify({
        name: userData.name,
        email: userData.email,
        picture: userData.picture,
        loginTime: new Date().toISOString()
      }));
      
      // Set user info
      isLoggedIn = true;
      trenutniKorisnik = userData;
      
      // Update UI
      document.getElementById('userPhoto').src = userData.picture;
      document.getElementById('userName').textContent = `Zalogowany jako: ${userData.name}`;
      
      // Show/hide elements
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('userInfo').classList.add('active');
      document.getElementById('warningBox').style.display = 'block';
      document.getElementById('menu').classList.add('show');
      
      alert(`✅ Zalogowany jako ${userData.name}!`);
    }

    function logout() {
      isLoggedIn = false;
      trenutniKorisnik = null;
      localStorage.removeItem('marcadesCurrentUser');
      
      // Reset UI
      document.getElementById('userInfo').classList.remove('active');
      document.getElementById('warningBox').style.display = 'none';
      document.getElementById('menu').classList.remove('show');
      document.getElementById('gameArea').classList.remove('active');
      document.getElementById('loginSection').style.display = 'flex';
    }

    // Sprawdź czy użytkownik jest już zalogowany (przy załadowaniu strony)
    function checkSavedLogin() {
      const savedData = localStorage.getItem('marcadesCurrentUser');
      if (savedData) {
        const userData = JSON.parse(savedData);
        isLoggedIn = true;
        trenutniKorisnik = userData;
        
        // Update UI
        document.getElementById('userPhoto').src = userData.picture;
        document.getElementById('userName').textContent = `Zalogowany jako: ${userData.name}`;
        
        // Show/hide elements
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('userInfo').classList.add('active');
        document.getElementById('warningBox').style.display = 'block';
        document.getElementById('menu').classList.add('show');
        
        console.log(`✅ Przywrócono logowanie: ${userData.name}`);
      }
    }

    function checkLogin() {
      if (!isLoggedIn) {
        alert('Musisz się zalogować przez Google, aby grać!');
        return false;
      }
      return true;
    }

    function startGame(zakres, mode) {
      if (!checkLogin()) return;
      
      maxZakres = zakres;
      tryb = mode;
      rundy = 1;
      wygraneRundy = 0;

      if (mode === 'PROFESJONALNE') {
        maxRundy = 5;
      } else {
        maxRundy = 1;
      }

      startNewRound();
      document.getElementById('menu').classList.remove('show');
      document.getElementById('gameArea').classList.add('active');
    }

    function startNewRound() {
      liczba = Math.floor(Math.random() * maxZakres) + 1;
      proby = 0;
      document.getElementById('input').disabled = false;
      document.getElementById('checkBtn').disabled = false;
      document.getElementById('input').value = '';
      document.getElementById('wynik').innerHTML = '';
      document.getElementById('wynik').className = '';

      updateGameTitle();
      updateStats();
      document.getElementById('input').focus();
    }

    function updateGameTitle() {
      let title = `${tryb} - Zgadnij liczbę od 1 do ${maxZakres}`;
      if (maxRundy > 1) {
        title += ` (Runda ${rundy}/${maxRundy})`;
      }
      document.getElementById('gameTitle').innerHTML = title;
    }

    function updateStats() {
      document.getElementById('probyCount').innerHTML = proby;
      if (maxRundy > 1) {
        document.getElementById('roundInfo').innerHTML = `Wygrane rundy: ${wygraneRundy}/${maxRundy}`;
      } else {
        document.getElementById('roundInfo').innerHTML = '';
      }
    }

    function sprawdz() {
      let proba = parseInt(document.getElementById('input').value);

      if (isNaN(proba) || proba < 1 || proba > maxZakres) {
        alert(`Proszę wpisać liczbę od 1 do ${maxZakres}`);
        return;
      }

      proby++;
      let wynik = document.getElementById('wynik');

      if (proba < liczba) {
        wynik.innerHTML = `⬇️ Za nisko! Próba ${proby}`;
        wynik.className = 'hint';
      } else if (proba > liczba) {
        wynik.innerHTML = `⬆️ Za wysoko! Próba ${proby}`;
        wynik.className = 'hint';
      } else {
        wynik.innerHTML = `✅ Brawo! Zgadłeś po ${proby} próbach!`;
        wynik.className = 'success';
        document.getElementById('input').disabled = true;
        document.getElementById('checkBtn').disabled = true;
        wygraneRundy++;

        if (rundy < maxRundy) {
          wynik.innerHTML += `<br><br>Następna runda za 2 sekundy...`;
          setTimeout(() => {
            rundy++;
            startNewRound();
          }, 2000);
        } else {
          wynik.innerHTML += `<br><br>🎉 Gratulacje! Ukończyłeś wszystkie rundy!`;
        }
        updateStats();
        return;
      }

      updateStats();
      document.getElementById('input').focus();
    }

    function backToMenu() {
      document.getElementById('gameArea').classList.remove('active');
      document.getElementById('menu').classList.add('show');
      rundy = 1;
      wygraneRundy = 0;
    }

    // Enable Enter key to submit
    document.getElementById('input').addEventListener('keypress', function(event) {
      if (event.key === 'Enter' && !document.getElementById('checkBtn').disabled) {
        sprawdz();
      }
    });

    // Sprawdź zalogowanie przy załadowaniu strony
    window.addEventListener('DOMContentLoaded', function() {
      checkSavedLogin();
    });

    // Alternatywnie, jeśli DOMContentLoaded się nie wywoła
    checkSavedLogin();
  </script>
</body>
</html>
