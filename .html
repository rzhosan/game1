<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zgadnij Liczbę</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 400px;
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
    }

    input {
      padding: 10px 15px;
      font-size: 16px;
      border: 2px solid #667eea;
      border-radius: 5px;
      margin-right: 10px;
      width: 120px;
    }

    button {
      padding: 10px 25px;
      font-size: 16px;
      background-color: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #764ba2;
    }

    #wynik {
      margin-top: 20px;
      font-size: 18px;
      min-height: 30px;
      color: #333;
      font-weight: bold;
    }

    .success {
      color: #27ae60;
    }

    .hint {
      color: #e74c3c;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Zgadnij liczbę od 1 do 100!</h1>
    <div>
      <input type="number" id="input" min="1" max="100" placeholder="Wpisz liczbę">
      <button onclick="sprawdz()">Sprawdź</button>
    </div>
    <p id="wynik"></p>
  </div>

  <script>
    let liczba = Math.floor(Math.random() * 100) + 1;
    let proby = 0;

    function sprawdz() {
      let proba = parseInt(document.getElementById('input').value);
      
      if (isNaN(proba) || proba < 1 || proba > 100) {
        alert('Proszę wpisać liczbę od 1 do 100');
        return;
      }

      proby++;
      let wynik = document.getElementById('wynik');

      if (proba < liczba) {
        wynik.innerHTML = `Za nisko! Próba ${proby}`;
        wynik.className = 'hint';
      } else if (proba > liczba) {
        wynik.innerHTML = `Za wysoko! Próba ${proby}`;
        wynik.className = 'hint';
      } else {
        wynik.innerHTML = `Brawo! Zgadłeś po ${proby} próbach! <br><button onclick="location.reload()">Graj ponownie</button>`;
        wynik.className = 'success';
        document.getElementById('input').disabled = true;
        document.querySelector('button').disabled = true;
      }

      document.getElementById('input').focus();
    }

    // Enable Enter key to submit
    document.getElementById('input').addEventListener('keypress', function(event) {
      if (event.key === 'Enter') {
        sprawdz();
      }
    });
  </script>
</body>
</html>
